name: dispatch-lock-v26-once

on:
  pull_request:
    types: [synchronize]

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-lock-v26-once
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.head_ref == 'feat/real-data-v0.20'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact v0.26 snapshot lock
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run lock-v26-snapshot.yml \
            --ref feat/real-data-v0.20 \
            -f run_id=32675196453 \
            -f artifact_id=9502476322 \
            -f artifact_sha256=a162270d94528429c0d3dcca89152f57fba9ed12654b0a2b70fbb0386fa8af1a
