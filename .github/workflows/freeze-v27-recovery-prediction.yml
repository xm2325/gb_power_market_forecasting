name: freeze-v27-recovery-prediction

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freeze-v27-recovery-prediction
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-data-v0.20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,live]'

      - name: Verify immutable implementation, miss and recovery lock before market access
        run: |
          pytest -q \
            tests/test_v27_implementation_lock.py \
            tests/test_v27_first_pretarget_freeze_miss.py \
            tests/test_v27_pretarget_recovery.py \
            tests/test_version_metadata.py

      - name: Load recovery boundary
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          r = json.loads(Path('reports/forward/v27/V0_27_PRETARGET_RECOVERY_LOCK.json').read_text())
          print(f"RECOVERY_DECISION={r['recovery_decision_time_utc']}")
          print(f"RECOVERY_TARGET={r['recovery_target_start_utc']}")
          PY

      - name: Wait without market access until locked recovery decision
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd
          from gb_power_market.v27_pretarget_recovery import verify_recovery_prediction_window

          recovery = json.loads(Path('reports/forward/v27/V0_27_PRETARGET_RECOVERY_LOCK.json').read_text())
          decision = pd.Timestamp(recovery['recovery_decision_time_utc'])
          target = pd.Timestamp(recovery['recovery_target_start_utc'])
          now = pd.Timestamp(datetime.now(timezone.utc))
          if now >= target:
              raise SystemExit('RECOVERY_PRETARGET_WINDOW_MISSED_BEFORE_NETWORK_ACCESS')
          if now < decision:
              time.sleep(max(0.0, (decision - now).total_seconds()) + 1.0)
          print(verify_recovery_prediction_window(recovery_lock=recovery, now_utc=datetime.now(timezone.utc)))
          PY

      - name: Download bounded NESO vintages
        run: |
          python scripts/download_neso_v21_window.py \
            --start-date 2026-07-12 \
            --end-date-exclusive 2026-08-26 \
            --out data/external/v27_recovery/neso_current_window.csv \
            --manifest reports/v27_recovery/neso_window_manifest.json

      - name: Materialise and hard-filter NESO to decision-time publications
        run: |
          python scripts/materialise_v21_current.py \
            --input data/external/v27_recovery/neso_current_window.csv \
            --out data/processed/v27_recovery/forecast_current_unfiltered.parquet \
            --manifest reports/v27_recovery/neso_materialise_manifest.json
          python scripts/filter_neso_asof.py \
            --input data/processed/v27_recovery/forecast_current_unfiltered.parquet \
            --cutoff-utc "$RECOVERY_DECISION" \
            --out data/processed/v27_recovery/forecast_current_asof.parquet \
            --manifest reports/v27_recovery/neso_asof_manifest.json

      - name: Download Elexon history only before recovery decision
        run: |
          python scripts/download_elexon_mid_exact_window.py \
            --start-utc 2026-07-01T00:00:00Z \
            --end-exclusive-utc "$RECOVERY_DECISION" \
            --out-dir data/external/v27_recovery/elexon_mid \
            --manifest reports/v27_recovery/elexon_mid_exact_manifest.json

      - name: Materialise decision-time Elexon history
        run: |
          python scripts/materialise_elexon_v22_mid.py \
            --bundle-dir data/external/v27_recovery/elexon_mid \
            --out data/processed/v27_recovery/reference_market.parquet \
            --manifest reports/v27_recovery/elexon_mid_materialise_manifest.json

      - name: Replay frozen 2h history only through latest causally available target
        run: |
          python scripts/run_v24_continuous_forward_monitor.py \
            --elexon-reference data/processed/v27_recovery/reference_market.parquet \
            --neso-current data/processed/v27_recovery/forecast_current_asof.parquet \
            --model-state reports/locked/V0_21_FROZEN_MODEL_STATE.json \
            --start-utc 2026-07-12T12:00:00Z \
            --end-exclusive-utc "$RECOVERY_DECISION" \
            --out-dir reports/v24_for_v27_recovery

      - name: Freeze recovery target prediction without realised target
        run: |
          python scripts/freeze_v27_recovery_forward_prediction.py \
            --reference-history data/processed/v27_recovery/reference_market.parquet \
            --neso-current data/processed/v27_recovery/forecast_current_asof.parquet \
            --historical-frozen-rows reports/v24_for_v27_recovery/forward_rows_2h.csv

      - name: Enforce pre-target and no-label contracts immediately before commit
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd

          prediction = json.loads(Path('reports/forward/v27/V0_27_PRETARGET_RECOVERY_PREDICTION.json').read_text())
          provenance = json.loads(Path('reports/forward/v27/V0_27_PRETARGET_RECOVERY_PREDICTION_PROVENANCE.json').read_text())
          recovery = json.loads(Path('reports/forward/v27/V0_27_PRETARGET_RECOVERY_LOCK.json').read_text())
          elexon = json.loads(Path('reports/v27_recovery/elexon_mid_exact_manifest.json').read_text())
          neso = json.loads(Path('reports/v27_recovery/neso_asof_manifest.json').read_text())
          decision = pd.Timestamp(recovery['recovery_decision_time_utc'])
          target = pd.Timestamp(recovery['recovery_target_start_utc'])
          now = pd.Timestamp(datetime.now(timezone.utc))

          if now >= target:
              raise SystemExit('RECOVERY_PRETARGET_COMMIT_WINDOW_MISSED')
          if pd.Timestamp(prediction['decision_time_utc']) != decision or pd.Timestamp(prediction['target_start_utc']) != target:
              raise SystemExit('recovery prediction boundary changed')
          if prediction['target_label_status'] != 'UNOBSERVED_NOT_ACCESSED' or prediction['realised_price_in_prediction_record'] is not False:
              raise SystemExit('recovery prediction contains or claims target outcome')
          if provenance['target_label_accessed'] is not False:
              raise SystemExit('recovery prediction provenance claims target access')
          if prediction['original_forward_boundary_changed'] is not False or provenance['original_forward_boundary_changed'] is not False:
              raise SystemExit('recovery prediction moved original v0.27 boundary')
          if pd.Timestamp(prediction['freeze_completed_utc']) >= target:
              raise SystemExit('recovery prediction freeze completed after target')
          if pd.Timestamp(prediction['neso_publish_time_utc']) > decision:
              raise SystemExit('future NESO vintage entered recovery prediction')
          if pd.Timestamp(neso['max_kept_publish_time_utc']) > decision:
              raise SystemExit('NESO as-of file contains post-decision publication')
          if pd.Timestamp(elexon['end_exclusive_utc']) != decision:
              raise SystemExit('Elexon history boundary differs from recovery decision')
          if any(pd.Timestamp(c['request_to_inclusive_utc']) >= decision for c in elexon['chunks']):
              raise SystemExit('Elexon request included target starts at/after decision')
          print(json.dumps(prediction, indent=2))
          PY

      - name: Commit prediction before recovery target begins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/forward/v27/V0_27_PRETARGET_RECOVERY_PREDICTION.json \
            reports/forward/v27/V0_27_PRETARGET_RECOVERY_PREDICTION_PROVENANCE.json \
            reports/v27_recovery/neso_window_manifest.json \
            reports/v27_recovery/neso_materialise_manifest.json \
            reports/v27_recovery/neso_asof_manifest.json \
            reports/v27_recovery/elexon_mid_exact_manifest.json \
            reports/v27_recovery/elexon_mid_materialise_manifest.json
          git diff --cached --stat
          git commit -m "Freeze v0.27 recovery prediction before target outcome"
          git fetch origin feat/real-data-v0.20
          git rebase origin/feat/real-data-v0.20
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd
          p = json.loads(Path('reports/forward/v27/V0_27_PRETARGET_RECOVERY_PREDICTION.json').read_text())
          if pd.Timestamp(datetime.now(timezone.utc)) >= pd.Timestamp(p['target_start_utc']):
              raise SystemExit('RECOVERY_PRETARGET_PUSH_WINDOW_MISSED')
          if p['target_label_status'] != 'UNOBSERVED_NOT_ACCESSED':
              raise SystemExit('target-label state changed before push')
          PY
          git push origin HEAD:feat/real-data-v0.20
