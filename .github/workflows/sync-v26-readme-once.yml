name: sync-v26-readme-once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: sync-v26-readme-once
  cancel-in-progress: false

jobs:
  sync:
    if: github.head_ref == 'feat/real-data-v0.20'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-data-v0.20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render latest locked v0.26 status
        run: python scripts/update_readme_v26_status.py
      - name: Verify renderer
        run: pytest -q tests/test_update_readme_v26_status.py
      - name: Commit only if README changed
        run: |
          if git diff --quiet README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Sync README to latest locked v0.26 snapshot"
          git fetch origin feat/real-data-v0.20
          git rebase origin/feat/real-data-v0.20
          python scripts/update_readme_v26_status.py
          git diff --exit-code README.md
          git push origin HEAD:feat/real-data-v0.20
