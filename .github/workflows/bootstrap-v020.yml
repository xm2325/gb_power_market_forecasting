name: bootstrap-v020-real-data

on:
  push:
    branches:
      - feat/real-data-v0.20
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-v020.yml'

permissions:
  contents: write

jobs:
  hydrate-publish-and-run-real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: feat/real-data-v0.20
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hydrate audited v0.20 source snapshot
        run: |
          cat bootstrap/part-*.b64 | tr -d '\n' | base64 -d > /tmp/gbpm-v020.zip
          unzip -oq /tmp/gbpm-v020.zip -d .
          test -f pyproject.toml
          test -f scripts/download_neso_v18_bundle.py
          test -f scripts/download_elexon_v19_bundle.py
          test -f .github/workflows/real-market-evidence.yml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,live]'

      - name: Run full curated test suite
        run: pytest -q

      - name: Publish normal source tree before long network run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r bootstrap .github/workflows/bootstrap-v020.yml
          git add -- \
            README.md VERSION .gitignore pyproject.toml \
            src scripts tests fixtures docs data/samples \
            .github/workflows/real-market-evidence.yml \
            reports/v20_evidence reports/TEST_STATUS.json
          git commit -m "Publish v0.20 real-data forecasting pipeline"
          git push origin HEAD:feat/real-data-v0.20

      - name: Download real NESO forecast archive and outturn
        id: neso_download
        continue-on-error: true
        run: |
          python scripts/download_neso_v18_bundle.py \
            --mode auto \
            --out-dir data/external/neso_2026_bundle \
            --manifest reports/v19_real_market/neso_download_manifest.json

      - name: Materialise real NESO Parquet
        id: neso_materialise
        if: always()
        continue-on-error: true
        run: |
          python scripts/materialise_v18_parquet.py \
            --bundle-dir data/external/neso_2026_bundle \
            --out-dir data/processed/v18_neso \
            --manifest reports/v19_real_market/neso_materialise_manifest.json

      - name: Evaluate real NESO physical forecasts
        id: neso_benchmark
        if: always()
        continue-on-error: true
        run: |
          python scripts/run_v18_real_neso_benchmark.py \
            --data-dir data/processed/v18_neso \
            --out-dir reports/v19_real_market/neso_physical_benchmark

      - name: Download real Elexon MID and settlement system prices
        id: elexon_download
        if: always()
        continue-on-error: true
        run: |
          python scripts/download_elexon_v19_bundle.py \
            --start-date 2026-01-01 \
            --end-date-exclusive 2026-08-16 \
            --out-dir data/external/elexon_v19 \
            --manifest reports/v19_real_market/elexon_download_manifest.json

      - name: Materialise and audit real Elexon market data
        id: elexon_materialise
        if: always()
        continue-on-error: true
        run: |
          python scripts/materialise_elexon_v19.py \
            --bundle-dir data/external/elexon_v19 \
            --out-dir data/processed/v19_elexon \
            --report-dir reports/v19_real_market \
            --start-date 2026-01-01 \
            --end-date-exclusive 2026-08-16

      - name: Run fixed-window real price benchmark
        id: price_benchmark
        if: always()
        continue-on-error: true
        run: |
          python scripts/run_v19_real_price_benchmark.py \
            --neso-dir data/processed/v18_neso \
            --elexon-dir data/processed/v19_elexon \
            --out-dir reports/v19_real_market

      - name: Build claim-safe evidence ledger
        if: always()
        run: |
          PYTHONPATH=src python scripts/build_v20_evidence_bundle.py \
            --report-dir reports/v19_real_market \
            --out-dir reports/v20_evidence \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload real processed data and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gb-power-market-v20-real-data-and-evidence
          path: |
            reports/v19_real_market/
            reports/v20_evidence/
            data/processed/v18_neso/
            data/processed/v19_elexon/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Commit small real-run evidence to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find reports/v19_real_market reports/v20_evidence \
            -type f -size -5M \
            \( -name '*.json' -o -name '*.csv' -o -name '*.md' \) \
            -print0 2>/dev/null | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "No small evidence files changed"
          else
            git commit -m "Record v0.20 real-data evidence"
            git push origin HEAD:feat/real-data-v0.20
          fi

      - name: Final claim-integrity gate
        if: always()
        run: python scripts/check_v19_real_market_claim_gate.py
