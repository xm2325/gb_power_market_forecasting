name: adaptive-2h-v25

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-2h-v25-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptive-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,live]'

      - name: Test before accessing new labels
        run: pytest -q

      - name: Set safe market-data boundary
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          safe = now - timedelta(minutes=90)
          safe = safe.replace(minute=(safe.minute // 30) * 30, second=0, microsecond=0)
          source_end = safe.date() + timedelta(days=1)
          print(f"AVAILABLE_END_UTC={safe.isoformat().replace('+00:00', 'Z')}")
          print(f"SOURCE_END_DATE={source_end.isoformat()}")
          print("ELEXON_START_DATE=2026-07-01")
          print("NESO_START_DATE=2026-07-12")
          PY

      - name: Download bounded NESO vintages
        run: |
          python scripts/download_neso_v21_window.py \
            --start-date "$NESO_START_DATE" \
            --end-date-exclusive "$SOURCE_END_DATE" \
            --out data/external/v25/neso_current_window.csv \
            --manifest reports/v25_2h/neso_window_manifest.json

      - name: Materialise NESO vintages
        run: |
          python scripts/materialise_v21_current.py \
            --input data/external/v25/neso_current_window.csv \
            --out data/processed/v25/forecast_current.parquet \
            --manifest reports/v25_2h/neso_materialise_manifest.json

      - name: Download Elexon MID with warm-up
        run: |
          python scripts/download_elexon_v22_mid.py \
            --start-date "$ELEXON_START_DATE" \
            --end-date-exclusive "$SOURCE_END_DATE" \
            --out-dir data/external/v25/elexon_mid \
            --manifest reports/v25_2h/elexon_mid_manifest.json

      - name: Materialise Elexon market reference
        run: |
          python scripts/materialise_elexon_v22_mid.py \
            --bundle-dir data/external/v25/elexon_mid \
            --out data/processed/v25/reference_market.parquet \
            --manifest reports/v25_2h/elexon_mid_materialise_manifest.json

      - name: Recreate unchanged v0.24 frozen-model rows
        run: |
          python scripts/run_v24_continuous_forward_monitor.py \
            --elexon-reference data/processed/v25/reference_market.parquet \
            --neso-current data/processed/v25/forecast_current.parquet \
            --model-state reports/locked/V0_21_FROZEN_MODEL_STATE.json \
            --start-utc 2026-07-12T12:00:00Z \
            --end-exclusive-utc "$AVAILABLE_END_UTC" \
            --out-dir reports/v24_for_v25

      - name: Run v0.25 causal 2h correction, ledger and monitor
        run: |
          python scripts/run_v25_2h_adaptive_candidate.py \
            --v24-rows reports/v24_for_v25/forward_rows_2h.csv \
            --snapshot-registry reports/monitoring/V0_25_FORWARD_SNAPSHOT_REGISTRY.json \
            --genesis-ledger reports/monitoring/V0_25_FORWARD_LEDGER_FIRST6.csv \
            --out-dir reports/v25_2h

      - name: Enforce candidate, ledger, monitoring and promotion contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('reports/v25_2h/v25_2h_summary.json').read_text())
          monitor = json.loads(Path('reports/v25_2h/v25_monitor_state.json').read_text())
          ledger = json.loads(Path('reports/v25_2h/forward_ledger_check.json').read_text())
          promotion = monitor['promotion_readiness']
          spec = summary['candidate_spec']
          if spec['forward_start_utc'] != '2026-08-21T11:30:00+00:00':
              raise SystemExit('v0.25 forward start changed')
          if monitor['candidate'] != '2H_FROZEN_PLUS_CAUSAL_48H_RESIDUAL_MEAN':
              raise SystemExit('v0.25 candidate identity changed')
          if monitor['policy']['alert_min_rows'] != 48:
              raise SystemExit('v0.25 alert sample gate changed')
          if promotion['policy']['minimum_forward_rows'] != 336:
              raise SystemExit('v0.25 promotion sample gate changed')
          if promotion.get('automatic_promotion') is True:
              raise SystemExit('v0.25 must never auto-promote')
          if ledger['status'] != 'LOCKED_PREFIX_REPRODUCED':
              raise SystemExit('latest immutable v0.25 prefix was not reproduced')
          genesis = ledger['genesis_anchor']
          if genesis['locked_rows'] != 6:
              raise SystemExit('v0.25 genesis row count changed')
          if genesis['locked_chain_tip_sha256'] != 'b27a99b21466c8a4cbf58d29ad9c980a174b278cee1a741582a978af747789f2':
              raise SystemExit('v0.25 genesis chain tip changed')
          print({
              'candidate': spec['candidate'],
              'forward': summary['new_forward_segment'],
              'latest_locked_prefix': {
                  'sequence': ledger['locked_registry_sequence'],
                  'rows': ledger['locked_rows'],
                  'chain_tip': ledger['locked_chain_tip_sha256'],
                  'new_rows': ledger['new_rows_after_locked_prefix'],
              },
              'maturity_stage': monitor['maturity_stage'],
              'alert_status': monitor['alert_status'],
              'alerts': monitor['alerts'],
              'promotion_status': promotion['status'],
          })
          PY

      - name: Upload v0.25 candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: v25-adaptive-2h-${{ github.run_id }}
          path: reports/v25_2h/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
