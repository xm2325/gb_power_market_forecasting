name: lock-v27-development-result

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful validate-v27-development workflow run ID
        required: true
        type: string
      artifact_id:
        description: GitHub artifact ID recorded for that run
        required: true
        type: string
      artifact_sha256:
        description: SHA-256 of the downloaded artifact ZIP
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: lock-v27-development-result
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-data-v0.20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,live]'

      - name: Verify frozen candidate and lock contract before artifact access
        run: |
          pytest -q \
            tests/test_v27_candidate_lock.py \
            tests/test_v27_direction_candidate.py \
            tests/test_lock_v27_development_validation.py \
            tests/test_v27_validation_workflow_contract.py \
            tests/test_update_readme_v27_validation_status.py

      - name: Download exact successful sealed-validation artifact
        uses: actions/download-artifact@v4
        with:
          name: v27-development-validation-${{ inputs.run_id }}
          path: _v27_validation_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}

      - name: Lock immutable development-validation result
        run: |
          python scripts/lock_v27_development_validation.py \
            --artifact-dir _v27_validation_artifact \
            --run-id "${{ inputs.run_id }}" \
            --artifact-id "${{ inputs.artifact_id }}" \
            --artifact-sha256 "${{ inputs.artifact_sha256 }}"

      - name: Refresh README from locked evidence state
        run: |
          python scripts/update_readme_v26_status.py
          python scripts/update_readme_v27_validation_status.py

      - name: Verify locked result, eligibility state and README
        run: |
          pytest -q \
            tests/test_v27_candidate_lock.py \
            tests/test_lock_v27_development_validation.py \
            tests/test_v27_validation_workflow_contract.py \
            tests/test_update_readme_v26_status.py \
            tests/test_update_readme_v27_validation_status.py

      - name: Commit, rebase and push immutable validation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/monitoring docs README.md
          git diff --cached --stat
          git commit -m "Lock v0.27 sealed development validation result"
          git fetch origin feat/real-data-v0.20
          git rebase origin/feat/real-data-v0.20
          python scripts/update_readme_v26_status.py
          python scripts/update_readme_v27_validation_status.py
          git diff --exit-code README.md
          pytest -q \
            tests/test_update_readme_v26_status.py \
            tests/test_update_readme_v27_validation_status.py \
            tests/test_v27_candidate_lock.py
          git push origin HEAD:feat/real-data-v0.20
