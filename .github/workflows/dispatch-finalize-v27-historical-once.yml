name: dispatch-finalize-v27-historical-once

on:
  pull_request:
    types: [synchronize]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch finalizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run finalize-v27-historical-evidence.yml --repo "${{ github.repository }}" --ref feat/real-data-v0.20
