name: confirmatory-v23

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/V23_SEALED_SMOKE'

permissions:
  contents: read

concurrency:
  group: confirmatory-v23-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sealed-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,live]'

      - name: Test sealed contracts
        run: pytest -q

      - name: Set safe availability boundary
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          safe = now - timedelta(minutes=90)
          safe = safe.replace(minute=(safe.minute // 30) * 30, second=0, microsecond=0)
          source_end = safe.date() + timedelta(days=1)
          print(f"AVAILABLE_END_UTC={safe.isoformat().replace('+00:00', 'Z')}")
          print(f"SOURCE_END_DATE={source_end.isoformat()}")
          print("ELEXON_START_DATE=2026-08-14")
          print("NESO_START_DATE=2026-08-21")
          PY

      - name: Show sealed boundary only
        run: |
          echo "sealed start:      2026-08-21T11:30:00Z"
          echo "fixed reveal end:  2026-09-04T11:30:00Z"
          echo "available through: $AVAILABLE_END_UTC"
          echo "No price-bearing data is uploaded before reveal."

      - name: Download bounded NESO current window
        run: |
          python scripts/download_neso_v21_window.py \
            --start-date "$NESO_START_DATE" \
            --end-date-exclusive "$SOURCE_END_DATE" \
            --out data/external/v23/neso_current_window.csv \
            --manifest reports/v23_confirmatory/neso_window_manifest.json

      - name: Materialise bounded NESO current window
        run: |
          python scripts/materialise_v21_current.py \
            --input data/external/v23/neso_current_window.csv \
            --out data/processed/v23/forecast_current.parquet \
            --manifest reports/v23_confirmatory/neso_materialise_manifest.json

      - name: Download bounded Elexon MID only
        run: |
          python scripts/download_elexon_v22_mid.py \
            --start-date "$ELEXON_START_DATE" \
            --end-date-exclusive "$SOURCE_END_DATE" \
            --out-dir data/external/v23/elexon_mid \
            --manifest reports/v23_confirmatory/elexon_mid_manifest.json

      - name: Materialise Elexon market reference
        run: |
          python scripts/materialise_elexon_v22_mid.py \
            --bundle-dir data/external/v23/elexon_mid \
            --out data/processed/v23/reference_market.parquet \
            --manifest reports/v23_confirmatory/elexon_mid_materialise_manifest.json

      - name: Run sealed confirmatory availability check
        run: |
          python scripts/run_v23_sealed_confirmatory.py \
            --elexon-reference data/processed/v23/reference_market.parquet \
            --neso-current data/processed/v23/forecast_current.parquet \
            --model-state reports/locked/V0_21_FROZEN_MODEL_STATE.json \
            --available-end-exclusive-utc "$AVAILABLE_END_UTC" \
            --out-dir reports/v23_confirmatory

      - name: Enforce recursive pre-reveal seal
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          from gb_power_market.confirmatory_v23 import assert_pre_reveal_payload_safe

          root = Path('reports/v23_confirmatory')
          payload = json.loads((root / 'confirmatory_all.json').read_text())
          reveal = bool(payload.get('reveal_occurred'))
          if not reveal:
              for p in root.glob('*.json'):
                  obj = json.loads(p.read_text())
                  if p.name.startswith('confirmatory_'):
                      assert_pre_reveal_payload_safe(obj)
              forbidden = ('mae', 'rmse', 'improvement', 'abs_error', 'prediction', 'classification', 'bootstrap')
              for p in root.glob('*.csv'):
                  with p.open(newline='', encoding='utf-8') as f:
                      header = next(csv.reader(f), [])
                  bad = [c for c in header if any(x in c.lower() for x in forbidden)]
                  if bad:
                      raise SystemExit(f'pre-reveal CSV contains performance columns: {bad}')
          print({'reveal_occurred': reveal, 'report_files': sorted(p.name for p in root.iterdir())})
          PY

      - name: Set reveal flag
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          p = json.loads(Path('reports/v23_confirmatory/confirmatory_all.json').read_text())
          print('REVEAL_OCCURRED=' + ('true' if p.get('reveal_occurred') else 'false'))
          PY

      - name: Upload sealed report artifact
        uses: actions/upload-artifact@v4
        with:
          name: v23-sealed-confirmatory-${{ github.run_id }}
          path: reports/v23_confirmatory/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload processed sources only after reveal
        if: env.REVEAL_OCCURRED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v23-reveal-sources-${{ github.run_id }}
          path: data/processed/v23/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
