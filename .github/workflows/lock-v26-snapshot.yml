name: lock-v26-snapshot

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful adaptive-2h-v26 workflow run ID
        required: true
        type: string
      artifact_id:
        description: GitHub artifact ID recorded for that run
        required: true
        type: string
      artifact_sha256:
        description: SHA-256 of the downloaded artifact ZIP
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: lock-v26-snapshot
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-data-v0.20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,live]'

      - name: Verify implementation lock before artifact access
        run: |
          pytest -q \
            tests/test_v26_implementation_lock.py \
            tests/test_v26_implementation_provenance.py \
            tests/test_v26_snapshot_registry.py \
            tests/test_update_readme_v26_status.py

      - name: Download exact successful v0.26 artifact
        uses: actions/download-artifact@v4
        with:
          name: v26-consensus-2h-${{ inputs.run_id }}
          path: _snapshot_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}

      - name: Lock append-only v0.26 snapshot
        run: |
          python scripts/lock_v26_forward_snapshot.py \
            --artifact-dir _snapshot_artifact \
            --artifact-id "${{ inputs.artifact_id }}" \
            --artifact-sha256 "${{ inputs.artifact_sha256 }}" \
            --run-id "${{ inputs.run_id }}"

      - name: Refresh recruiter-facing v0.26 README status
        run: |
          python scripts/update_readme_v26_status.py

      - name: Verify registry, provenance, README and full ledger chain
        run: |
          pytest -q \
            tests/test_forward_ledger_v26.py \
            tests/test_v26_implementation_lock.py \
            tests/test_v26_implementation_provenance.py \
            tests/test_v26_snapshot_registry.py \
            tests/test_lock_v26_forward_snapshot.py \
            tests/test_update_readme_v26_status.py

      - name: Commit, rebase and push immutable snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/monitoring docs README.md
          git diff --cached --stat
          git commit -m "Lock v0.26 forward snapshot"
          git fetch origin feat/real-data-v0.20
          git rebase origin/feat/real-data-v0.20
          python scripts/update_readme_v26_status.py
          git diff --exit-code README.md
          pytest -q \
            tests/test_v26_implementation_lock.py \
            tests/test_v26_snapshot_registry.py \
            tests/test_forward_ledger_v26.py \
            tests/test_update_readme_v26_status.py
          git push origin HEAD:feat/real-data-v0.20
