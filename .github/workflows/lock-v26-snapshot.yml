name: lock-v26-snapshot

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful adaptive-2h-v26 workflow run ID
        required: true
        type: string
      artifact_id:
        description: GitHub artifact ID recorded for that run
        required: true
        type: string
      artifact_sha256:
        description: SHA-256 of the downloaded artifact ZIP
        required: true
        type: string
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  actions: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCK_RUN_ID: ${{ inputs.run_id || '32632409230' }}
      LOCK_ARTIFACT_ID: ${{ inputs.artifact_id || '9491420056' }}
      LOCK_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 || '06d21cd67b40d3143ba472f412e2e2e3f403691d43f01ba71b810b96bddda249' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-data-v0.20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,live]'

      - name: Verify implementation lock before artifact access
        run: |
          pytest -q \
            tests/test_v26_implementation_lock.py \
            tests/test_v26_implementation_provenance.py \
            tests/test_v26_snapshot_registry.py

      - name: Download exact successful v0.26 artifact
        uses: actions/download-artifact@v4
        with:
          name: v26-consensus-2h-${{ env.LOCK_RUN_ID }}
          path: _snapshot_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.LOCK_RUN_ID }}

      - name: Lock append-only v0.26 snapshot
        run: |
          python scripts/lock_v26_forward_snapshot.py \
            --artifact-dir _snapshot_artifact \
            --artifact-id "$LOCK_ARTIFACT_ID" \
            --artifact-sha256 "$LOCK_ARTIFACT_SHA256" \
            --run-id "$LOCK_RUN_ID"

      - name: Verify registry, provenance, digests and full ledger chain
        run: |
          pytest -q \
            tests/test_forward_ledger_v26.py \
            tests/test_v26_implementation_lock.py \
            tests/test_v26_implementation_provenance.py \
            tests/test_v26_snapshot_registry.py \
            tests/test_lock_v26_forward_snapshot.py

      - name: Commit, rebase and push immutable snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/monitoring docs
          git diff --cached --stat
          git commit -m "Lock v0.26 forward snapshot"
          git fetch origin feat/real-data-v0.20
          git rebase origin/feat/real-data-v0.20
          pytest -q \
            tests/test_v26_implementation_lock.py \
            tests/test_v26_snapshot_registry.py \
            tests/test_forward_ledger_v26.py
          git push origin HEAD:feat/real-data-v0.20
