name: v28-prospective-shadow

on:
  workflow_dispatch:
  schedule:
    # Offset from the top of the hour to reduce GitHub Actions congestion.
    # Actual lead time is measured at prediction creation, not assumed to be 2h.
    - cron: '11,41 * * * *'

permissions:
  contents: write

concurrency:
  group: v28-prospective-shadow-default
  cancel-in-progress: false

jobs:
  prospective-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install -e '.[dev,live]'
      - name: Verify new prospective contracts
        run: |
          pytest -q tests/test_prospective_v28.py tests/test_v28_cycle_contract.py
      - name: Lock a conservative source-query cutoff before network access
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import pandas as pd
          from gb_power_market.prospective_v28 import market_end_for_decision
          now = pd.Timestamp.now(tz="UTC")
          end = market_end_for_decision(now, delay_minutes=90)
          start = end - pd.Timedelta(days=12)
          print("V28_MARKET_START=" + start.isoformat())
          print("V28_MARKET_END=" + end.isoformat())
          PY
      - name: Download only mature Elexon market index prices
        run: |
          python scripts/download_elexon_mid_exact_window.py \
            --start-utc "$V28_MARKET_START" \
            --end-exclusive-utc "$V28_MARKET_END" \
            --out-dir data/external/v28/mid \
            --manifest data/external/v28/elexon_download_manifest.json
      - name: Materialise timestamped source snapshot
        run: |
          python scripts/materialise_elexon_v22_mid.py \
            --bundle-dir data/external/v28/mid \
            --out data/processed/v28/reference_market.parquet \
            --manifest data/external/v28/elexon_materialise_manifest.json
      - name: Independently score old Git-frozen targets and freeze a new target
        run: |
          python scripts/run_v28_shadow_cycle.py \
            --reference-market data/processed/v28/reference_market.parquet \
            --input-end-exclusive-utc "$V28_MARKET_END" \
            --download-manifest data/external/v28/elexon_download_manifest.json \
            --out-dir reports/forward/v28 \
            --run-state .v28_run_state.json
      - name: Verify target is still in future before commit and push
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          run = json.loads(Path(".v28_run_state.json").read_text())
          p = run.get("new_prediction_path")
          if p:
              forecast = json.loads(Path(p).read_text())
              now = pd.Timestamp.now(tz="UTC")
              target = pd.Timestamp(forecast["target_start_utc"])
              if target <= now or forecast["target_outcome_accessed"] is not False:
                  raise SystemExit("PRETARGET_LOCK_FAILURE: refusing post-target commit")
              if any(x in forecast for x in ("realised_price_gbp_mwh", "absolute_error_gbp_mwh")):
                  raise SystemExit("FORECAST_CONTAINS_TARGET_LABEL")
              print("new pretarget target:", target.isoformat())
          else:
              print("no new prediction this run; pending scores/checkpoint may still be appended")
          PY
      - name: Append records without rewriting older predictions or scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/forward/v28
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "[skip ci] Append v0.28 prospective shadow evidence"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Preserve diagnostic run state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v28-shadow-${{ github.run_id }}
          path: |
            .v28_run_state.json
            data/external/v28/elexon_download_manifest.json
            data/external/v28/elexon_materialise_manifest.json
          if-no-files-found: ignore
          retention-days: 14
