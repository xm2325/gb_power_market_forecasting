name: lock-v27-pretarget-recovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lock-v27-pretarget-recovery
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-data-v0.20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Verify immutable miss and unchanged v0.27 implementation
        run: |
          pytest -q \
            tests/test_v27_implementation_lock.py \
            tests/test_v27_first_pretarget_freeze_miss.py \
            tests/test_v27_pretarget_recovery.py \
            tests/test_version_metadata.py

      - name: Create one zero-outcome recovery boundary
        run: python scripts/create_v27_pretarget_recovery_lock.py

      - name: Verify recovery lock before commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          p = Path('reports/forward/v27/V0_27_PRETARGET_RECOVERY_LOCK.json')
          recovery = json.loads(p.read_text())
          implementation = json.loads(Path('reports/locked/V0_27_IMPLEMENTATION_LOCK.json').read_text())
          if recovery['status'] != 'PRETARGET_EVIDENCE_RECOVERY_LOCKED_NOT_YET_PREDICTED':
              raise SystemExit('unexpected recovery status')
          if recovery['original_forward_start_utc'] != implementation['forward_start_utc']:
              raise SystemExit('recovery moved original v0.27 forward start')
          if recovery['model_or_rule_changed_for_recovery'] is not False:
              raise SystemExit('recovery changed predictive model or rule')
          if recovery['target_outcome_accessed_to_select_recovery_boundary'] is not False:
              raise SystemExit('recovery boundary claims target access')
          if pd.Timestamp(recovery['recovery_decision_time_utc']) <= pd.Timestamp(recovery['recovery_lock_timestamp_utc']):
              raise SystemExit('recovery decision is not strictly post-lock')
          if pd.Timestamp(recovery['recovery_target_start_utc']) - pd.Timestamp(recovery['recovery_decision_time_utc']) != pd.Timedelta(minutes=120):
              raise SystemExit('recovery target is not 2h after decision')
          print(json.dumps(recovery, indent=2))
          PY

      - name: Commit, rebase and push immutable recovery lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/forward/v27/V0_27_PRETARGET_RECOVERY_LOCK.json
          git commit -m "Lock v0.27 pre-target evidence recovery boundary"
          git fetch origin feat/real-data-v0.20
          git rebase origin/feat/real-data-v0.20
          pytest -q tests/test_v27_first_pretarget_freeze_miss.py tests/test_v27_pretarget_recovery.py
          git push origin HEAD:feat/real-data-v0.20
